# Tool configuration only. Palmer is deployed from requirements.txt (Heroku)
# and run from the repo root; it is not built or published as a package.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # long lines are mostly prose in docstrings and prompts
    "E402",  # load_dotenv() and init_db() deliberately run before later imports
    "E702",  # `conn = _conn(); cur = conn.cursor()` is the house style in db.py
]
